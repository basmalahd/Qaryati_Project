
name: Qaryati | CI Pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------
  # Code Quality
  # ----------------------------------------
  lint:
    name: Code Quality | Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff==0.9.10

      - name: Check Python code
        run: ruff check . --output-format github

  # ----------------------------------------
  # Integration Tests
  # ----------------------------------------
  tests:
    name: Tests | Python 3.12 + PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: qaryati_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: qaryati_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U qaryati_test -d qaryati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test

      DATABASE_URL: >-
        postgresql+psycopg://qaryati_test:ci_test_password@localhost:5432/qaryati_test

      TEST_DATABASE_URL: >-
        postgresql+psycopg://qaryati_test:ci_test_password@localhost:5432/qaryati_test

      JWT_SECRET_KEY: >-
        tttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttt

      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify PostgreSQL connection
        run: |
          python -c "import os, psycopg; conn = psycopg.connect(os.environ['TEST_DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://')); print('PostgreSQL connection successful'); conn.close()"

      - name: Run pytest against PostgreSQL
        run: python -m pytest -q
